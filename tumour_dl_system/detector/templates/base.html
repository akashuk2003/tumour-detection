<!DOCTYPE html>
<html>

<head>
    <title>NeuroScan AI - Academic Prototype</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
        }

        .warning {
            background: #ffeeba;
            color: #856404;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 0.9em;
            text-align: center;
            border: 1px solid #ffeeba;
        }

        .results {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>NeuroScan AI</h1>
            <p>Deep Learning Tumour Detection & Growth Analysis</p>
            <a href="/upload/" class="btn">Single Analysis</a>
            <a href="/compare/" class="btn">Growth Comparison</a>
            <a href="/metrics/" class="btn">Training Metrics</a>
        </div>
        {% block content %}{% endblock %}

    </div>
</body>

</html>
